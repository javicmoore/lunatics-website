<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lunatic's — Relojes y accesorios para hombre en Mexicali</title>
    <meta
      name="description"
      content="Lunatic's: relojes Casio, cadenas, pulseras, dijes y sets de regalo para hombre. Dos sucursales en Mexicali, Baja California."
    />
    <meta name="theme-color" content="#08090a" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon / iconos (reemplazables en /public) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / redes sociales.
         Cuando exista dominio definitivo: usar URLs absolutas (VITE_SITE_URL) y agregar canonical. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Lunatic's" />
    <meta property="og:title" content="Lunatic's — Relojes y accesorios en Mexicali" />
    <meta
      property="og:description"
      content="Relojes Casio, cadenas, pulseras, dijes y sets para hombre. Dos sucursales en Mexicali."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logotipo de Lunatic's junto a un reloj Casio plateado con carátula azul" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Único asset precargado: la escena inicial del hero (una variante por orientación). -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(orientation: portrait)"
      imagesrcset="/images/hero/hero-wrist-portrait-700.avif 700w, /images/hero/hero-wrist-portrait-1000.avif 1000w"
      imagesizes="120vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(orientation: landscape)"
      imagesrcset="/images/hero/hero-wrist-landscape-1200.avif 1200w, /images/hero/hero-wrist-landscape-1586.avif 1586w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; color: #f4f5f6; background: #08090a; font-family: system-ui, sans-serif">
        Lunatic's — Relojes y accesorios para hombre. Mexicali, B.C. Activa JavaScript para ver la experiencia completa.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
